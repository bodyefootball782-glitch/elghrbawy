<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إنشاء حساب | أحمد الغرباوي</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../css/auth.css"></head><body class="auth-v3"><div class="auth-wrap"><section class="auth-card wide"><a class="auth-brand" href="../index.html">أحمد الغرباوي<small>AHMED ELGHRBAWY · PHYSICS</small></a><div class="stepper"><span class="active">1</span><i></i><span>2</span><i></i><span>3</span></div><h1>اعمل حسابك في 3 خطوات</h1><p class="auth-sub">اختار نوع حسابك، كمّل بياناتك، وخد مفتاحك للمنصة.</p><form id="registerForm">
<div class="reg-step active" data-step="1"><div class="choice-grid"><button type="button" class="account-choice" data-type="student"><span>🎓</span><b>طالب</b><small>محتوى + امتحانات + نتائج</small></button><button type="button" class="account-choice" data-type="admin"><span>👑</span><b>Admin</b><small>حساب إداري — الصلاحية لا تُمنح بالتسجيل</small></button></div><input type="hidden" id="accountType" value=""><button type="button" id="next1" class="btn btn-primary btn-xl full-btn" disabled>نكمل <i class="fa-solid fa-arrow-left"></i></button></div>
<div class="reg-step" data-step="2"><label>الاسم <input id="fullName" placeholder="مثال: أحمد الغرباوي" autocomplete="name"></label><div id="studentOnly"><label>المرحلة<select id="stage"><option value="">اختار المرحلة</option><option value="ابتدائية">ابتدائية</option><option value="إعدادية">إعدادية</option><option value="ثانوية">ثانوية</option></select></label><label>الصف الدراسي<select id="grade" disabled><option value="">اختار المرحلة أولًا</option></select></label></div><div class="step-actions"><button type="button" class="btn btn-ghost" data-prev="1">رجوع</button><button type="button" id="next2" class="btn btn-primary" >التالي</button></div></div>
<div class="reg-step" data-step="3"><label>كلمة السر <input id="password" type="password" minlength="10" maxlength="10" required placeholder="10 خانات بالضبط" autocomplete="new-password"></label><label>تأكيد كلمة السر <input id="passwordConfirm" type="password" minlength="10" maxlength="10" required placeholder="اكتبها مرة تانية" autocomplete="new-password"></label><div class="rules">🔐 10 أحرف أو أرقام أو رموز — من غير مسافات.</div><div class="step-actions"><button type="button" class="btn btn-ghost" data-prev="2">رجوع</button><button class="btn btn-primary" type="submit">إنشاء الحساب <i class="fa-solid fa-arrow-left"></i></button></div></div>
<div id="authMsg" class="auth-msg"></div></form><div class="auth-links"><span>عندك حساب؟</span><a href="login.html">دخول</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script></body></html>
