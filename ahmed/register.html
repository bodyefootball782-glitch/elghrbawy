<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080f"><title>إنشاء حساب | أحمد الغرباوي</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../css/auth.css"></head><body><div class="auth-math-bg" aria-hidden="true"><span>π</span><span>√</span><span>∑</span><span>x²</span><span>÷</span><span>∞</span><span>Δ</span><span>∫</span><span>≠</span><span>+</span><span>y=mx+b</span><span>∴</span></div><main class="auth-wrap"><section class="auth-card wide"><a class="auth-brand" href="../index.html">أحمد الغرباوي<small>AHMED ELGHRBAWY</small></a><span class="auth-icon">✦</span><h1>إنشاء حساب جديد</h1><p>حسابك التعليمي هيكون محفوظ على المنصة. كلمة السر هي مفتاح الدخول لحسابك.</p><form id="registerForm"><div class="form-grid">
<label class="full">نوع الحساب<select id="accountType" required><option value="">اختار نوع الحساب</option><option value="student">طالب</option><option value="admin">Admin</option></select></label>
<div id="studentFields" class="form-grid full"><label class="full">الاسم الرباعي<input id="fullName" placeholder="مثال: محمد أحمد علي حسن" autocomplete="name"></label><label>المرحلة<select id="stage"><option value="">اختار المرحلة</option><option value="ابتدائية">ابتدائية</option><option value="إعدادية">إعدادية</option><option value="ثانوية">ثانوية</option></select></label><label>الصف الدراسي<select id="grade" disabled><option value="">اختار المرحلة أولًا</option></select></label></div>
<label class="full">كلمة السر<input id="password" type="password" minlength="10" maxlength="10" required placeholder="10 أحرف / أرقام / رموز" autocomplete="new-password"></label><label class="full">تأكيد كلمة السر<input id="passwordConfirm" type="password" minlength="10" maxlength="10" required placeholder="اكتب كلمة السر مرة ثانية" autocomplete="new-password"></label></div>
<div class="rules">🔐 كلمة السر: <b>10 أحرف أو أرقام أو رموز بالضبط</b> — بدون مسافات.</div><button class="btn btn-primary" type="submit">إنشاء الحساب <i class="fa-solid fa-arrow-left"></i></button><div id="authMsg" class="auth-msg"></div></form><div class="auth-links"><span>عندك حساب؟</span><a href="login.html">دخول</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script></body></html>
